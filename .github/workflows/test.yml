name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stub-run:
    name: stub run (Nextflow ${{ matrix.nextflow }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow: ["26.04.6", "latest-stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}

      - name: Check config parses for every profile
        run: |
          for p in test docker singularity conda "test,docker"; do
            nextflow config -profile "$p" > /dev/null
          done

      # Stub blocks only: no tools, databases or downloads needed
      - name: Wiring check (stub run)
        run: nextflow run main.nf -profile test -stub-run

      - name: Upload Nextflow log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-log-${{ matrix.nextflow }}
          path: .nextflow.log

  docker-stub:
    name: stub run (docker profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.6"

      - name: Helper image is publicly pullable and has its tools
        run: |
          img=$(nextflow config -profile docker -flat | sed -n "s/^params.container_helper = '\(.*\)'/\1/p")
          docker pull "$img"
          docker run --rm "$img" python -c "import pandas, openpyxl, Bio"
          docker run --rm "$img" fasterq-dump --version

      - name: Wiring check (stub run, docker profile)
        run: nextflow run main.nf -profile test,docker -stub-run

  lint:
    name: script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python helpers compile
        run: python -m py_compile workflow/scripts/*.py
      - name: Shell syntax and ShellCheck
        run: |
          bash -n bin/setup_databases.sh
          shellcheck bin/setup_databases.sh
