# NOTE: reference only. main.nf reads its parameters from nextflow.config; the
# phylogenomics settings (Panaroo/Gubbins/IQ-TREE) live there, not here. Sections
# below target_loci are planned selection-analysis steps that are not implemented.
# =============================================================================
# Unified config.yaml - Klebsiella pneumoniae AMR Genomics & Phylogenomics Pipeline
# Lead: Md. Hasibul Hossain (Sukanto), SAU Microbiology & Parasitology
# =============================================================================

samples_tsv: "config/samples.tsv"
results_dir: "results"
logs_dir: "logs"

paths:
  raw_reads_dir: "results/00_raw_reads"
  fastp_dir: "results/01_qc/fastp"
  multiqc_dir: "results/01_qc/multiqc"
  assembly_dir: "results/02_assembly"
  busco_dir: "results/03_busco"
  filtered_assembly_dir: "results/04_filtered_assemblies"
  amr_rgi_dir: "results/05_amr/rgi"
  amr_resfinder_dir: "results/05_amr/resfinder"
  metadata_dir: "results/06_metadata"
  phylogenomics_dir: "results/07_phylogenomics"
  selection_dir: "results/09_selection"
  logs_dir: "logs"

databases:
  busco_lineage: "resources/busco_db/enterobacterales_odb10"
  card_json: "resources/card_data/card.json"
  resfinder_db: "resources/resfinder/db_resfinder"
  bakta_db: "resources/db-light"

thresholds:
  busco_completeness_min: 95.0
  coverage_min: 50.0
  max_contigs_core: 200
  min_contig_length: 500

params:
  threads: 8
  fastp:
    min_quality: 20
    window_size: 4
    min_length: 50
  shovill:
    ram: 10
  spades_mode: "--isolate"
  target_amr_gene: "blaCTX-M-15"
  rgi_alignment_tool: "BLAST"
  resfinder_species: "Klebsiella"
  entrez_email: "${NCBI_EMAIL}"
  entrez_api_key: "${NCBI_API_KEY}"

target_loci:
  blaCTX-M-15:
    query_fasta: "resources/references/blaCTX-M-15.fasta"
    flank_bp: 500
    feature_type: "cds"
  rpoB:
    query_fasta: "resources/references/rpoB.fasta"
    flank_bp: 0
    feature_type: "cds"
  fusA:
    query_fasta: "resources/references/fusA.fasta"
    flank_bp: 0
    feature_type: "cds"
  ompK35:
    query_fasta: "resources/references/ompK35.fasta"
    flank_bp: 0
    feature_type: "cds"
  ompK36:
    query_fasta: "resources/references/ompK36.fasta"
    flank_bp: 0
    feature_type: "cds"

codon_align:
  method: "macse"
  threads: 8

codeml:
  binary: "codeml"
  models: ["M0", "M1a", "M2a", "M7", "M8"]
  seqtype: 1
  runmode: 0
  cleandata: 1

hyphy:
  binary: "hyphy"
  methods: ["SLAC", "MEME"]
  slac_pvalue: 0.1
  meme_pvalue: 0.1

selection_thresholds:
  positive_dnds: 1.0
  lrt_pvalue: 0.05
  bayes_eb_posterior: 0.95